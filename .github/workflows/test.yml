name: Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:15-3.3
        env:
          POSTGRES_DB: orbitharbor
          POSTGRES_USER: geo
          POSTGRES_PASSWORD: geo
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v7

    - name: Cache Conda packages
      uses: actions/cache@v6
      with:
        path: ~/conda_pkgs_dir
        key: conda-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('environment.yaml') }}

    - name: Setup Miniconda
      uses: conda-incubator/setup-miniconda@v4
      with:
        auto-update-conda: true
        use-only-tar-bz2: true
        python-version: '3.13'
        environment-file: environment.yaml
        activate-environment: orbitharbor

    - name: Setup config file
      shell: bash -l {0}
      run: cp config/settings_example.yaml config/settings.yaml

    - name: Override postgis host for CI
      shell: bash -l {0}
      run: |
        sed -i 's/host: postgres/host: localhost/' config/settings.yaml

    - name: Apply database schema
      shell: bash -l {0}
      run: PGPASSWORD=geo psql -h localhost -U geo -d orbitharbor -f db/schema.sql

    - name: Run tests with coverage
      shell: bash -l {0}
      run: |
        conda activate orbitharbor
        pytest --cov --cov-report=xml --cov-report=term

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./coverage.xml
        fail_ci_if_error: false
