# environment.yaml
---
name: orbitharbor
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.12
  - gdal
  - rasterio
  - libgdal-jp2openjpeg
  - pytorch
  - torchvision
  - pip
  - pip:
      - kafka-python
      - psycopg2-binary
      - python-dotenv
      - requests
      - websockets
      - pydantic
      - loguru
      - pytest
      - pyyaml
      - minio
      - shapely
      - snowflake-connector-python
      - pytest-cov
      - pydeck
      - streamlit
      - pandas
